name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Capacitor Android Project
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          rm -rf www/node_modules www/android www/www 2>/dev/null || true

          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yadhavan.tuition",
            "appName": "Yadhavan AI Tuition",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yadhavan-AI-Tuition-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
