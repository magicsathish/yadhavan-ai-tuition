name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build APK using Bubblewrap
        run: |
          npx @bubblewrap/cli init --manifest="https://magicsathish.github.io/yadhavan-ai-tuition/manifest.json"
          # Builds the native Android package

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadhavan-AI-Tuition-APK
          path: '**/*.apk'
